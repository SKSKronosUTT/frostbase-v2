services:
  db:
    image: postgres:16
    container_name: frostbase-v4-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-frostbase}
      POSTGRES_USER: ${POSTGRES_USER:-frostbase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-frostbase}
    volumes:
      - frostbase_v4_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-frostbase} -d ${POSTGRES_DB:-frostbase}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: frostbase-v4-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-frostbase}:${POSTGRES_PASSWORD:-frostbase}@db:5432/${POSTGRES_DB:-frostbase}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-this-secret-key}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@frostbase.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      DEVICE_OFFLINE_SECONDS: ${DEVICE_OFFLINE_SECONDS:-60}
      DASHBOARD_FRESH_MINUTES: ${DASHBOARD_FRESH_MINUTES:-10}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      WEATHER_CACHE_SECONDS: ${WEATHER_CACHE_SECONDS:-600}
      AUTO_CREATE_TABLES: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8050,http://127.0.0.1:8050,http://localhost:8060,http://127.0.0.1:8060,http://localhost:8070,http://127.0.0.1:8070}
    ports:
      - "${APP_PORT:-8050}:8050"

volumes:
  frostbase_v4_pgdata:
