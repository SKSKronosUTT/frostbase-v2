x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-frostbase}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@db:5432/${POSTGRES_DB:-frostbase}
  SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY (>=64 chars) en .env}
  DEVICE_KEY_PEPPER: ${DEVICE_KEY_PEPPER:?Define DEVICE_KEY_PEPPER (>=64 chars) en .env}
  DEVICE_KEY_FAST_PATH: ${DEVICE_KEY_FAST_PATH:-true}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@frostbase.local}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD (>=12 chars) en .env}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
  DASHBOARD_FRESH_MINUTES: ${DASHBOARD_FRESH_MINUTES:-10}
  DISCONNECT_CHECK_SECONDS: ${DISCONNECT_CHECK_SECONDS:-30}
  ENABLE_INPROCESS_WATCHER: "false"
  OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
  OSRM_TIMEOUT_SECONDS: ${OSRM_TIMEOUT_SECONDS:-5}
  WEATHER_TIMEOUT_SECONDS: ${WEATHER_TIMEOUT_SECONDS:-3}
  WEATHER_CACHE_SECONDS: ${WEATHER_CACHE_SECONDS:-600}
  ROUTE_GEOMETRY_ASYNC: ${ROUTE_GEOMETRY_ASYNC:-false}
  AUTO_CREATE_TABLES: "false"
  RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-memory}
  REDIS_URL: ${REDIS_URL:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8050,http://127.0.0.1:8050,http://localhost:8060,http://127.0.0.1:8060,http://localhost:8070,http://127.0.0.1:8070}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}

services:
  db:
    image: postgres:16
    container_name: frostbase-v4-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-frostbase}
      POSTGRES_USER: ${POSTGRES_USER:-frostbase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - frostbase_v4_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-frostbase} -d ${POSTGRES_DB:-frostbase}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: frostbase-v4-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-environment
    ports:
      - "${APP_PORT:-8050}:8050"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8050/health/ready', timeout=3).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  watcher:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: frostbase-v4-watcher
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["python", "-m", "scripts.disconnect_watcher"]
    environment:
      <<: *app-environment
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: frostbase-v4-redis
    restart: unless-stopped
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

volumes:
  frostbase_v4_pgdata:
