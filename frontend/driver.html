<!DOCTYPE html>
<html lang="es" data-theme="light">
  <head>
  <!-- @include head -->
</head>
  <body class="driver-page">
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <button
      class="driver-theme-toggle"
      id="themeToggle"
      type="button"
      aria-label="Cambiar tema"
    >
      <i class="fa-solid fa-moon"></i>
    </button>

    <main id="main" tabindex="-1" class="driver-shell">
      <h1 class="sr-only">Portal del conductor</h1>
      <!-- ===== Cabecera ===== -->
      <header class="driver-header">
        <div class="driver-header__user">
          <img
            src="assets/logo-160.png"
            alt="Logotipo FrostBase"
            class="driver-header__logo"
            width="36"
            height="36"
          />
          <div>
            <strong id="driverName">—</strong>
            <span class="muted" id="driverEmail">Cargando…</span>
          </div>
        </div>
        <div class="driver-header__meta">
          <span class="driver-truck-chip" id="truckChip">
            <i class="fa-solid fa-truck"></i> <span id="truckPlate">—</span>
          </span>
          <button
            class="btn btn--ghost btn--sm"
            id="changePasswordButton"
            type="button"
            aria-label="Cambiar contraseña"
          >
            <i class="fa-solid fa-key" aria-hidden="true"></i>
          </button>
          <button
            class="btn btn--primary btn--sm"
            id="logoutButton"
            type="button"
            aria-label="Cerrar sesión"
          >
            <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <!-- ===== Contenedor en vivo ===== -->
      <section
        class="card driver-container-card"
        aria-label="Contenedor en tiempo real"
      >
        <div class="driver-container-grid">
          <div class="driver-metric driver-metric--temp">
            <span class="driver-metric__label"
              ><i class="fa-solid fa-temperature-half"></i> Temperatura</span
            >
            <span class="driver-metric__value" id="containerTemp">—</span>
            <span class="driver-metric__range" id="containerTempRange">—</span>
          </div>
          <div class="driver-metric driver-metric--hum">
            <span class="driver-metric__label"
              ><i class="fa-solid fa-droplet"></i> Humedad</span
            >
            <span class="driver-metric__value" id="containerHum">—</span>
            <span class="driver-metric__range" id="containerHumRange">—</span>
          </div>
          <div class="driver-metric driver-metric--status">
            <span class="driver-metric__label">Estado</span>
            <span class="badge" id="containerStatus">Sin datos</span>
            <span class="driver-metric__range" id="containerLastSeen">—</span>
          </div>
          <div class="driver-metric driver-metric--door">
            <span class="driver-metric__label"
              ><i class="fa-solid fa-door-open"></i> Puerta</span
            >
            <span class="badge" id="doorState">Sin datos</span>
            <span class="driver-metric__range" id="doorLastEvent">—</span>
          </div>
        </div>
        <div class="driver-connection" id="connectionIndicator" aria-live="polite">
          <span class="driver-connection__dot"></span>
          <span id="connectionText">En vivo</span>
        </div>
      </section>

      <!-- ===== Ruta del día ===== -->
      <section class="card driver-route-card" aria-label="Ruta del día">
        <header class="card__header">
          <h2 class="card__title"><i class="fa-solid fa-route"></i> Ruta de hoy</h2>
          <span class="badge badge--muted" id="routeBadge">Sin ruta</span>
        </header>
        <div class="card__body driver-route-body" id="routeBody">
          <p class="muted" id="routeEmptyText">No tienes ruta programada para hoy.</p>
        </div>
      </section>

      <!-- ===== Viaje en curso / botón de inicio ===== -->
      <section class="card driver-trip-card" aria-label="Viaje">
        <header class="card__header">
          <h2 class="card__title"><i class="fa-solid fa-play"></i> Viaje</h2>
          <span class="badge badge--muted" id="tripBadge">Sin viaje</span>
        </header>
        <div class="card__body" id="tripBody">
          <div id="tripIdle">
            <button
              class="btn btn--primary btn--block driver-trip-start"
              id="startTripButton"
              type="button"
              hidden
            >
              <i class="fa-solid fa-play"></i> Iniciar viaje
            </button>
            <p class="muted driver-trip-blocked" id="tripBlocking" hidden></p>
          </div>
          <div id="tripActive" hidden>
            <div class="driver-trip-progress">
              <span class="driver-trip-progress__label" id="tripProgressLabel"
                >0 de 0 entregadas</span
              >
              <div class="driver-trip-progress__bar">
                <div class="driver-trip-progress__fill" id="tripProgressFill"></div>
              </div>
            </div>
            <div class="driver-orders" id="ordersList">
              <p class="muted">Cargando órdenes…</p>
            </div>
            <button
              class="btn btn--danger btn--block driver-trip-end"
              id="endTripButton"
              type="button"
            >
              <i class="fa-solid fa-flag-checkered"></i> Finalizar viaje
            </button>
          </div>
        </div>
      </section>

      <!-- ===== Alertas ===== -->
      <section class="card driver-alerts-card" aria-label="Alertas del contenedor">
        <header class="card__header">
          <h2 class="card__title">
            <i class="fa-solid fa-bell"></i> Alertas
            <span class="badge badge--danger" id="activeAlertCount" hidden>0</span>
          </h2>
        </header>
        <div class="card__body">
          <div id="alertsList" class="driver-alerts-list">
            <p class="muted">Sin alertas para mostrar.</p>
          </div>
        </div>
      </section>
    </main>

    <div class="toast-root" id="toastRoot"></div>
    <script type="module" src="js/pages/driver.js"></script>
  </body>
</html>
