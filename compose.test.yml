services:
  test-db:
    image: postgres:16
    container_name: frostbase-test-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: frostbase_test
      POSTGRES_USER: frostbase
      POSTGRES_PASSWORD: test-password
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frostbase -d frostbase_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - frostbase_test_pgdata:/var/lib/postgresql/data

volumes:
  frostbase_test_pgdata:
