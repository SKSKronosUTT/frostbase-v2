name: Nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: frostbase_test
          POSTGRES_USER: frostbase
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frostbase -d frostbase_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://frostbase:test-password@localhost:5432/frostbase_test
      SECRET_KEY: nightly-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      DEVICE_KEY_PEPPER: nightly-pepper-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      ADMIN_PASSWORD: NightlyPassword123!
      E2E_ADMIN_PASSWORD: NightlyPassword123!
      LOGIN_IP_RATE_LIMIT: "1000"
      LOGIN_IDENTIFIER_RATE_LIMIT: "1000"
      IOT_IP_RATE_LIMIT: "100000"
      ENVIRONMENT: development
      COOKIE_SECURE: "false"
      AUTO_CREATE_TABLES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias backend
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependencias frontend
        working-directory: frontend
        run: npm ci
      - name: Navegador Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: E2E
        working-directory: frontend
        run: npx playwright test
      - name: Artefactos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

  loadtest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: frostbase_test
          POSTGRES_USER: frostbase
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frostbase -d frostbase_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://frostbase:test-password@localhost:5432/frostbase_test
      SECRET_KEY: nightly-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      DEVICE_KEY_PEPPER: nightly-pepper-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      ADMIN_PASSWORD: NightlyPassword123!
      ENVIRONMENT: development
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias backend
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Arrancar aplicación
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8050 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8050/health/ready && break
            sleep 2
          done
      - name: Carga IoT (50 dispositivos, 60 s)
        working-directory: backend
        run: python -m scripts.loadtest --devices 50 --duration 60 --interval 2
